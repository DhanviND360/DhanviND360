<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <style>
    .card { transition: stroke 0.3s; }
    .card:hover { stroke: #67FF5F; }
  </style>
  <rect width="800" height="240" fill="#000000" rx="12" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
  <text x="40" y="40" font-family="monospace" font-size="12" fill="#67FF5F">// TECH STACK</text>
  
  <g font-family="monospace" fill="#FFFFFF">
    <!-- Python -->
    <g transform="translate(40, 80)">
      <rect width="160" height="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" rx="8" class="card"/>
      <path d="M80,30 C80,20 70,20 60,20 C40,20 40,40 40,40 L40,50 L70,50 L70,55 L30,55 C20,55 20,70 20,80 C20,90 30,90 30,90 L40,90 L40,80 C40,60 60,60 60,60 L80,60 C90,60 90,50 90,50 L90,30 Z M50,25 L55,25 L55,30 L50,30 Z" fill="none" stroke="#FFFFFF" stroke-width="2" transform="scale(0.8) translate(10, 5)"/>
      <text x="80" y="100" font-size="14" text-anchor="middle">Python</text>
    </g>

    <!-- TypeScript -->
    <g transform="translate(220, 80)">
      <rect width="160" height="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" rx="8" class="card"/>
      <rect x="60" y="20" width="40" height="40" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <path d="M68,35 L80,35 L80,60 M80,35 L92,35 M92,35 L92,45" fill="none" stroke="#67FF5F" stroke-width="2"/>
      <text x="80" y="100" font-size="14" text-anchor="middle">TypeScript</text>
    </g>

    <!-- React -->
    <g transform="translate(400, 80)">
      <rect width="160" height="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" rx="8" class="card"/>
      <circle cx="80" cy="40" r="6" fill="#FFFFFF"/>
      <ellipse cx="80" cy="40" rx="20" ry="8" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
      <ellipse cx="80" cy="40" rx="20" ry="8" fill="none" stroke="#FFFFFF" stroke-width="1.5" transform="rotate(60 80 40)"/>
      <ellipse cx="80" cy="40" rx="20" ry="8" fill="none" stroke="#FFFFFF" stroke-width="1.5" transform="rotate(120 80 40)"/>
      <text x="80" y="100" font-size="14" text-anchor="middle">React</text>
    </g>

    <!-- Node.js -->
    <g transform="translate(580, 80)">
      <rect width="160" height="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" rx="8" class="card"/>
      <path d="M80,15 L105,30 L105,60 L80,75 L55,60 L55,30 Z" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
      <path d="M70,50 L75,55 L90,35" fill="none" stroke="#67FF5F" stroke-width="2"/>
      <text x="80" y="100" font-size="14" text-anchor="middle">Node.js</text>
    </g>
  </g>
</svg>
