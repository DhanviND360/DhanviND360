<svg width="100%" viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Current focus carousel">
  <style>
    .bg{fill:#000}
    .border{fill:none;stroke:#1e1e1e;stroke-width:1.5}
    .mono{font-family:'Courier New',Consolas,monospace}
    .label{fill:#7a7a7a}
    .white{fill:#ffffff}
    .accent{fill:#67FF5F}
    .dim{fill:#7a7a7a}
    .icon{fill:none;stroke:#67FF5F;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .card{animation:cycle 24s infinite}
    @keyframes cycle{
      0%{opacity:1}
      13%{opacity:1}
      17%{opacity:0}
      96%{opacity:0}
      100%{opacity:1}
    }
    .c1{animation-delay:0s}
    .c2{animation-delay:-4s}
    .c3{animation-delay:-8s}
    .c4{animation-delay:-12s}
    .c5{animation-delay:-16s}
    .c6{animation-delay:-20s}
    .dot{fill:#2a2a2a;animation:dotcycle 24s infinite}
    @keyframes dotcycle{
      0%{fill:#67FF5F}
      13%{fill:#67FF5F}
      17%{fill:#2a2a2a}
      96%{fill:#2a2a2a}
      100%{fill:#67FF5F}
    }
    .d1{animation-delay:0s}
    .d2{animation-delay:-4s}
    .d3{animation-delay:-8s}
    .d4{animation-delay:-12s}
    .d5{animation-delay:-16s}
    .d6{animation-delay:-20s}
    .pulse{animation:pulse 2.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  </style>

  <rect class="bg" width="640" height="300" rx="14"/>
  <rect class="border" x="1" y="1" width="638" height="298" rx="14"/>
  <text x="24" y="30" class="mono label" font-size="12">&gt; CURRENT FOCUS</text>
  <circle class="pulse" cx="608" cy="26" r="4" fill="#67FF5F"/>

  <!-- Card 1: GemmAgent -->
  <g class="card c1">
    <ellipse class="icon" cx="320" cy="120" rx="70" ry="26" transform="rotate(-12 320 120)"/>
    <ellipse class="icon" cx="320" cy="120" rx="46" ry="70" transform="rotate(20 320 120)" opacity="0.5"/>
    <text x="320" y="128" text-anchor="middle" class="mono accent" font-size="26" font-weight="700">GemmAgent</text>
    <text x="320" y="196" text-anchor="middle" class="mono white" font-size="14">AI Agentic Platform</text>
    <text x="320" y="216" text-anchor="middle" class="mono dim" font-size="12">RAG &#8226; Tools &#8226; Memory</text>
  </g>

  <!-- Card 2: AI Agents -->
  <g class="card c2">
    <polygon class="icon" points="320,68 356,90 356,132 320,154 284,132 284,90"/>
    <circle class="icon" cx="320" cy="111" r="10"/>
    <line class="icon" x1="320" y1="68" x2="320" y2="88"/>
    <line class="icon" x1="356" y1="90" x2="330" y2="106"/>
    <line class="icon" x1="284" y1="90" x2="310" y2="106"/>
    <text x="320" y="196" text-anchor="middle" class="mono white" font-size="14">Designing Multi-Agent Systems</text>
    <text x="320" y="216" text-anchor="middle" class="mono dim" font-size="12">Reasoning &#8226; Planning &#8226; Execution</text>
  </g>

  <!-- Card 3: LLM Engineering -->
  <g class="card c3">
    <text x="320" y="135" text-anchor="middle" class="mono accent" font-size="42" font-weight="700">&lt;/&gt;</text>
    <text x="320" y="196" text-anchor="middle" class="mono white" font-size="14">LLM Engineering</text>
    <text x="320" y="216" text-anchor="middle" class="mono dim" font-size="12">Prompting &#8226; Fine-tuning &#8226; Eval</text>
  </g>

  <!-- Card 4: Full Stack -->
  <g class="card c4">
    <path class="icon" d="M320 68 L338 106 L320 100 L302 106 Z"/>
    <path class="icon" d="M302 106 L320 100 L338 106 L328 150 L312 150 Z"/>
    <path class="icon" d="M308 150 L296 168" />
    <path class="icon" d="M332 150 L344 168" />
    <text x="320" y="196" text-anchor="middle" class="mono white" font-size="14">Shipping End-to-End Products</text>
    <text x="320" y="216" text-anchor="middle" class="mono dim" font-size="12">Frontend &#8226; Backend &#8226; Infra</text>
  </g>

  <!-- Card 5: Open Source -->
  <g class="card c5">
    <circle class="icon" cx="296" cy="80" r="8"/>
    <circle class="icon" cx="296" cy="150" r="8"/>
    <circle class="icon" cx="344" cy="115" r="8"/>
    <path class="icon" d="M296 88 L296 142"/>
    <path class="icon" d="M296 108 C296 118 306 118 336 116"/>
    <text x="320" y="196" text-anchor="middle" class="mono white" font-size="14">Building In Public</text>
    <text x="320" y="216" text-anchor="middle" class="mono dim" font-size="12">Contributing &#8226; Sharing &#8226; Learning</text>
  </g>

  <!-- Card 6: Available for Work -->
  <g class="card c6">
    <rect class="icon" x="288" y="92" width="64" height="44" rx="6"/>
    <path class="icon" d="M304 92 L304 82 C304 76 312 76 320 76 C328 76 336 76 336 82 L336 92"/>
    <line class="icon" x1="288" y1="112" x2="352" y2="112"/>
    <text x="320" y="196" text-anchor="middle" class="mono white" font-size="14">Available For Work</text>
    <text x="320" y="216" text-anchor="middle" class="mono dim" font-size="12">Freelance &#8226; Full-time &#8226; Collab</text>
  </g>

  <circle class="dot d1" cx="288" cy="264" r="4"/>
  <circle class="dot d2" cx="304" cy="264" r="4"/>
  <circle class="dot d3" cx="320" cy="264" r="4"/>
  <circle class="dot d4" cx="336" cy="264" r="4"/>
  <circle class="dot d5" cx="352" cy="264" r="4"/>
  <circle class="dot d6" cx="368" cy="264" r="4"/>
</svg>
