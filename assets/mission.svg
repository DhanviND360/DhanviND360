<svg width="100%" viewBox="0 0 900 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mission statements">
  <style>
    .bg{fill:#000}
    .border{fill:none;stroke:#1e1e1e;stroke-width:1.5}
    .mono{font-family:'Courier New',Consolas,monospace}
    .label{fill:#7a7a7a}
    .stmt{fill:#ffffff;font-size:20px}
    .accent{fill:#67FF5F}
    .m{animation:fade 15s infinite}
    @keyframes fade{
      0%{opacity:0}
      2%{opacity:1}
      17%{opacity:1}
      20%{opacity:0}
      100%{opacity:0}
    }
    .m1{animation-delay:0s}
    .m2{animation-delay:-3s}
    .m3{animation-delay:-6s}
    .m4{animation-delay:-9s}
    .m5{animation-delay:-12s}
  </style>

  <rect class="bg" width="900" height="100" rx="14"/>
  <rect class="border" x="1" y="1" width="898" height="98" rx="14"/>

  <text x="24" y="26" class="mono label" font-size="12">&gt; MISSION</text>
  <text x="866" y="26" class="mono accent" font-size="12" text-anchor="end">&#9679;</text>

  <text x="450" y="62" text-anchor="middle" class="mono stmt m m1">Building AI products that solve real-world problems.</text>
  <text x="450" y="62" text-anchor="middle" class="mono stmt m m2">Exploring agentic systems, RAG &amp; multi-agent orchestration.</text>
  <text x="450" y="62" text-anchor="middle" class="mono stmt m m3">Writing clean, scalable, production-grade code.</text>
  <text x="450" y="62" text-anchor="middle" class="mono stmt m m4">Shipping fast. Iterating faster.</text>
  <text x="450" y="62" text-anchor="middle" class="mono stmt m m5">Turning ideas into deployed, working software.</text>
</svg>
