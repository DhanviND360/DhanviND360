<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <style>
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .online-dot { animation: pulse 2s infinite; }
  </style>
  <rect width="800" height="240" fill="#000000" rx="12" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
  
  <!-- Terminal Window Controls -->
  <circle cx="24" cy="24" r="5" fill="#FFFFFF" fill-opacity="0.2"/>
  <circle cx="44" cy="24" r="5" fill="#FFFFFF" fill-opacity="0.2"/>
  <circle cx="64" cy="24" r="5" fill="#FFFFFF" fill-opacity="0.2"/>
  <line x1="20" y1="48" x2="780" y2="48" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Logo / Avatar Abstract -->
  <g transform="translate(60, 90)">
    <rect x="0" y="0" width="80" height="80" fill="none" stroke="#67FF5F" stroke-width="2" rx="8"/>
    <path d="M20,20 L40,40 L20,60 M40,40 L60,40" stroke="#67FF5F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="60" cy="60" r="6" fill="#67FF5F"/>
  </g>

  <!-- Name and Role -->
  <text x="180" y="130" font-family="monospace" font-size="48" fill="#FFFFFF" font-weight="bold">DHANVI_</text>
  <text x="180" y="160" font-family="monospace" font-size="16" fill="#FFFFFF" fill-opacity="0.7">AI ENGINEER // FULL STACK DEVELOPER</text>
  <text x="180" y="184" font-family="monospace" font-size="12" fill="#67FF5F">&gt; INITIALIZING SYSTEM...</text>

  <!-- Online Indicator -->
  <g transform="translate(680, 90)">
    <rect x="0" y="0" width="100" height="30" fill="none" stroke="#67FF5F" stroke-width="1" rx="15"/>
    <circle cx="15" cy="15" r="4" fill="#67FF5F" class="online-dot"/>
    <text x="28" y="19" font-family="monospace" font-size="12" fill="#67FF5F">ONLINE</text>
  </g>
</svg>
