<svg width="100%" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dhanvi hero banner">
  <style>
    .bg{fill:#000}
    .border{fill:none;stroke:#1e1e1e;stroke-width:1.5}
    .mono{font-family:'Courier New',Consolas,monospace}
    .white{fill:#ffffff}
    .accent{fill:#67FF5F}
    .dim{fill:#7a7a7a}
    .stroke-white{fill:none;stroke:#ffffff;stroke-width:2}
    .stroke-accent{fill:none;stroke:#67FF5F;stroke-width:2}
    .cursor{animation:blink 1.1s step-end infinite}
    @keyframes blink{50%{opacity:0}}
    .dot{animation:pulse 2.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.6)}}
    .logo{animation:fade 5s ease-in-out infinite;transform-origin:75px 100px}
    @keyframes fade{0%,100%{opacity:1}50%{opacity:.55}}
    .ring{fill:none;stroke:#2a2a2a;stroke-width:1}
  </style>

  <rect class="bg" width="900" height="200" rx="14"/>
  <rect class="border" x="1" y="1" width="898" height="198" rx="14"/>

  <text x="24" y="30" class="mono dim" font-size="12">&gt; DHANVI.OS v2.1.0</text>

  <circle class="dot" cx="846" cy="26" r="4" fill="#67FF5F"/>
  <text x="862" y="30" class="mono dim" font-size="12">SYSTEM STATUS: ONLINE</text>

  <g class="logo">
    <rect x="46" y="66" width="34" height="68" rx="4" class="stroke-white"/>
    <rect x="70" y="86" width="34" height="68" rx="4" fill="#000" stroke="#67FF5F" stroke-width="2"/>
  </g>

  <text x="140" y="112" class="mono white" font-size="46" font-weight="700">DHANVI<tspan class="cursor accent">_</tspan></text>
  <text x="140" y="140" class="mono dim" font-size="14" letter-spacing="1">AI ENGINEER &#8226; FULL STACK DEVELOPER</text>
  <text x="140" y="162" class="mono accent" font-size="11" letter-spacing="2">BUILDER. LEARNER. PROBLEM SOLVER.</text>

  <circle class="ring" cx="820" cy="110" r="46"/>
  <circle class="ring" cx="820" cy="110" r="60"/>
</svg>
