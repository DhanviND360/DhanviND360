<svg width="100%" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Boot sequence">
  <style>
    .bg{fill:#000}
    .border{fill:none;stroke:#1e1e1e;stroke-width:1.5}
    .mono{font-family:'Courier New',Consolas,monospace}
    .label{fill:#7a7a7a}
    .white{fill:#ffffff}
    .accent{fill:#67FF5F}
    .row{animation:rowIn 6s ease-in-out infinite}
    @keyframes rowIn{
      0%{opacity:0;transform:translateX(-6px)}
      8%{opacity:1;transform:translateX(0)}
      92%{opacity:1;transform:translateX(0)}
      100%{opacity:0;transform:translateX(-6px)}
    }
    .r1{animation-delay:0s}
    .r2{animation-delay:.4s}
    .r3{animation-delay:.8s}
    .r4{animation-delay:1.2s}
    .r5{animation-delay:1.6s}
    .track{fill:none;stroke:#1e1e1e;stroke-width:6}
    .fill{fill:none;stroke:#67FF5F;stroke-width:6;stroke-linecap:round;
      transform-box:fill-box;transform-origin:left center;
      animation:fillBar 6s ease-in-out infinite;animation-delay:2s}
    @keyframes fillBar{
      0%{transform:scaleX(0)}
      55%{transform:scaleX(1)}
      90%{transform:scaleX(1)}
      100%{transform:scaleX(0)}
    }
    .ready{animation:readyIn 6s ease-in-out infinite;animation-delay:2.6s}
    @keyframes readyIn{
      0%{opacity:0}
      10%{opacity:1}
      90%{opacity:1}
      100%{opacity:0}
    }
  </style>

  <rect class="bg" width="900" height="260" rx="14"/>
  <rect class="border" x="1" y="1" width="898" height="258" rx="14"/>
  <text x="24" y="30" class="mono label" font-size="12">&gt; BOOT SEQUENCE</text>

  <g class="row r1"><circle cx="34" cy="58" r="3" class="accent" fill="#67FF5F"/><text x="48" y="63" class="mono white" font-size="14">Initializing System</text><text x="860" y="63" text-anchor="end" class="mono accent" font-size="13">OK</text></g>
  <g class="row r2"><circle cx="34" cy="90" r="3" class="accent" fill="#67FF5F"/><text x="48" y="95" class="mono white" font-size="14">Loading Modules</text><text x="860" y="95" text-anchor="end" class="mono accent" font-size="13">OK</text></g>
  <g class="row r3"><circle cx="34" cy="122" r="3" class="accent" fill="#67FF5F"/><text x="48" y="127" class="mono white" font-size="14">Fetching Live Data</text><text x="860" y="127" text-anchor="end" class="mono accent" font-size="13">OK</text></g>
  <g class="row r4"><circle cx="34" cy="154" r="3" class="accent" fill="#67FF5F"/><text x="48" y="159" class="mono white" font-size="14">Connecting APIs</text><text x="860" y="159" text-anchor="end" class="mono accent" font-size="13">OK</text></g>
  <g class="row r5"><circle cx="34" cy="186" r="3" class="accent" fill="#67FF5F"/><text x="48" y="191" class="mono white" font-size="14">Compiling Profile</text><text x="860" y="191" text-anchor="end" class="mono accent" font-size="13">OK</text></g>

  <line class="track" x1="24" y1="216" x2="876" y2="216"/>
  <line class="fill" x1="24" y1="216" x2="876" y2="216"/>

  <text x="24" y="244" class="mono accent ready" font-size="13">&gt; System Ready. Welcome!</text>
</svg>
